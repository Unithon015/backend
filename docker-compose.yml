services:
  baekend:
    image: ${DOCKER_IMAGE:-bbik-baekend:local}
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/app/data/uploads}
      OPEN_API_KEY: ${OPEN_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      NAMU_WIKI_INITIAL_SYNC_ENABLED: ${NAMU_WIKI_INITIAL_SYNC_ENABLED:-true}
      NAMU_WIKI_2026_SYNC_ENABLED: ${NAMU_WIKI_2026_SYNC_ENABLED:-true}
    restart: unless-stopped
    volumes:
      - content_uploads:/app/data/uploads

volumes:
  content_uploads:
